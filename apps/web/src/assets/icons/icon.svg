<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Sermon Smith — glowing cross</title>
  <defs>
    <!-- Intense blue light radiating from behind the cross -->
    <radialGradient id="ss-glow" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.95"/>
      <stop offset="26%" stop-color="#38bdf8" stop-opacity="0.88"/>
      <stop offset="52%" stop-color="#2563eb" stop-opacity="0.55"/>
      <stop offset="78%" stop-color="#1d4ed8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </radialGradient>
    <!-- Cross face: bright white with a cool light-blue fall-off -->
    <linearGradient id="ss-cross" x1="512" y1="150" x2="512" y2="870" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="ss-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="ss-edge" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="11" flood-color="#38bdf8" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- 1. Radial blue glow disc (transparent canvas) -->
  <circle cx="512" cy="500" r="475" fill="url(#ss-glow)"/>

  <!-- 2. Blurred cyan halo of the cross — light radiating from behind -->
  <g filter="url(#ss-blur)" opacity="0.9">
    <rect x="437" y="170" width="150" height="684" rx="20" fill="#22d3ee"/>
    <rect x="300" y="330" width="424" height="150" rx="20" fill="#22d3ee"/>
  </g>

  <!-- 3. Solid foreground Latin cross (tall; crossbar in upper third) -->
  <g filter="url(#ss-edge)">
    <rect x="437" y="170" width="150" height="684" rx="20" fill="url(#ss-cross)" stroke="#bae6fd" stroke-width="3"/>
    <rect x="300" y="330" width="424" height="150" rx="20" fill="url(#ss-cross)" stroke="#bae6fd" stroke-width="3"/>
  </g>

  <!-- 4. Subtle highlights — modern bevel, not flat -->
  <rect x="453" y="186" width="16" height="652" rx="8" fill="#ffffff" opacity="0.35"/>
  <rect x="316" y="346" width="392" height="14" rx="7" fill="#ffffff" opacity="0.30"/>
</svg>
