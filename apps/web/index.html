<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SermonSmith is a calm, plain-language workspace for preparing sermons and Bible lessons."
    />
    <title>SermonSmith</title>
    <script>
      (function () {
        var storageKey = 'sermonsmith.theme';

        function getSavedMode() {
          try {
            var saved = window.localStorage && window.localStorage.getItem(storageKey);
            if (!saved) return null;

            try {
              var parsed = JSON.parse(saved);
              if (parsed === 'light' || parsed === 'dark') return parsed;
              if (parsed && (parsed.mode === 'light' || parsed.mode === 'dark')) return parsed.mode;
            } catch (parseError) {
              if (saved === 'light' || saved === 'dark') return saved;
            }
          } catch (storageError) {
            return null;
          }

          return null;
        }

        function prefersDarkMode() {
          try {
            return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          } catch (mediaError) {
            return false;
          }
        }

        var mode = getSavedMode();
        var shouldUseDark = mode === 'dark' || (!mode && prefersDarkMode());

        document.documentElement.classList.toggle('dark', shouldUseDark);
        document.documentElement.style.colorScheme = shouldUseDark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
