<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sermon Smith - First Run Setup</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    .container {
      background: white; border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px; max-width: 500px; width: 100%;
    }
    .icon { width: 80px; height: 80px; margin: 0 auto 20px; display: block; }
    h1 { text-align: center; color: #333; margin-bottom: 10px; font-size: 24px; }
    .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; font-size: 14px; }
    input {
      width: 100%; padding: 12px; border: 2px solid #e0e0e0;
      border-radius: 6px; font-size: 14px; transition: border-color 0.3s;
    }
    input:focus { outline: none; border-color: #667eea; }
    .help-text { font-size: 12px; color: #888; margin-top: 5px; }
    button {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; border: none; border-radius: 6px;
      font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s;
    }
    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .error { color: #e74c3c; font-size: 13px; margin-top: 10px; text-align: center; }
    .success { color: #27ae60; font-size: 13px; margin-top: 10px; text-align: center; }
    .info { color: #73510d; background: #fff7d6; border: 1px solid #f0d98a; border-radius: 6px; font-size: 12px; line-height: 1.45; margin: 0 0 16px; padding: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <svg class="icon" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="bg" cx="50%" cy="50%" r="50%">
          <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
          <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
        </radialGradient>
      </defs>
      <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
      <rect x="226" y="106" width="60" height="300" rx="10" fill="white"/>
      <rect x="136" y="226" width="240" height="60" rx="10" fill="white"/>
    </svg>

    <h1>Welcome to Sermon Smith</h1>
    <p class="subtitle">Connect to your SermonSmith API server</p>

    <form id="setupForm">
      <div class="info" id="existingConfigNotice" hidden></div>
      <div class="form-group">
        <label for="apiUrl">API Server URL</label>
        <input
          type="url"
          id="apiUrl"
          name="apiUrl"
          placeholder="https://your-api.up.railway.app"
          value="http://localhost:3101"
          required
        />
        <div class="help-text">The URL of your SermonSmith backend (Railway or local)</div>
      </div>

      <button type="submit" id="submitBtn">Continue</button>
      <div id="message"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('setupForm');
    const submitBtn = document.getElementById('submitBtn');
    const message = document.getElementById('message');
    const apiUrlInput = document.getElementById('apiUrl');
    const existingConfigNotice = document.getElementById('existingConfigNotice');

    // A persisted localhost:3001 value may have been an explicit backend
    // choice. Let its owner keep or change it instead of silently rewriting
    // the configuration during the local-default upgrade.
    Promise.all([
      window.electron.getConfig(),
      window.electron.needsLocalApiUrlReview(),
    ]).then(([config, needsLocalApiUrlReview]) => {
      if (needsLocalApiUrlReview && config?.apiUrl) {
        apiUrlInput.value = config.apiUrl;
        existingConfigNotice.hidden = false;
        existingConfigNotice.textContent =
          `This desktop profile currently uses ${config.apiUrl}. The new local default is http://localhost:3101. Keep the current URL only if your backend is configured for it; otherwise change this URL to 3101 before continuing.`;
      }
    }).catch(() => {
      // A missing bridge is handled by the existing submission error path.
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const apiUrl = document.getElementById('apiUrl').value.trim();

      if (!apiUrl) {
        message.className = 'error';
        message.textContent = 'Please enter the API URL';
        return;
      }

      try { new URL(apiUrl); } catch {
        message.className = 'error';
        message.textContent = 'Please enter a valid URL';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving...';
      message.textContent = '';

      try {
        const result = await window.electron.saveConfig({ apiUrl });
        if (result.success) {
          message.className = 'success';
          message.textContent = 'Configuration saved! Opening app...';
        } else {
          message.className = 'error';
          message.textContent = 'Error: ' + (result.error || 'Failed to save');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Continue';
        }
      } catch (error) {
        message.className = 'error';
        message.textContent = 'Error: ' + error.message;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Continue';
      }
    });
  </script>
</body>
</html>
