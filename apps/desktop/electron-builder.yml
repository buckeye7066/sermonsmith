appId: com.sermonsmith.app
productName: Sermon Smith
directories:
  output: ../../dist-electron
files:
  - ../web/dist/**/*
  - electron/**/*
  - ../web/src/assets/icons/**/*
  - package.json
win:
  target: 
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: ../web/src/assets/icons/icon.ico
mac:
  target: 
    - dmg
    - zip
  icon: ../web/src/assets/icons/icon.png
  category: public.app-category.reference
linux:
  target:
    - AppImage
    - deb
  icon: ../web/src/assets/icons
  category: Education
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
