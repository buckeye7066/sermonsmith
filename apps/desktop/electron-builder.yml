appId: com.sermonsmith.app
productName: Sermon Smith
# npm workspaces hoist electron to the ROOT node_modules; electron-builder's
# module discovery walks from apps/desktop and misses it, failing with
# "Cannot compute electron version". Pin it explicitly (keep in sync with the
# electron devDependency).
electronVersion: 41.10.4
publish:
  provider: generic
  url: https://github.com/buckeye7066/sermonsmith/releases/download/desktop-updates/

directories:
  output: ../../dist-electron
files:
  - electron/**/*
  - package.json
extraResources:
  - from: ../web/dist
    to: web
    filter:
      - '**/*'
  - from: ../web/src/assets/icons
    to: icons
    filter:
      - '**/*'
win:
  target: 
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: ../web/src/assets/icons/icon.ico
mac:
  target: 
    - dmg
    - zip
  icon: ../web/src/assets/icons/icon.png
  category: public.app-category.reference
linux:
  target:
    - AppImage
    - deb
  icon: ../web/src/assets/icons
  category: Education
portable:
  artifactName: SermonSmith-Portable-${version}-${arch}.${ext}
nsis:
  artifactName: SermonSmith-Setup-${version}-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
