appId: com.sermonsmith.app
productName: Sermon Smith
# npm workspaces hoist electron to the ROOT node_modules; electron-builder's
# module discovery walks from apps/desktop and misses it, failing with
# "Cannot compute electron version". Pin it explicitly (keep in sync with the
# electron devDependency).
electronVersion: 41.1.1
# No auto-update/publish provider is configured; without this, the build
# crashes AFTER producing the installers while generating update-info
# metadata ("Cannot read properties of null (reading 'provider')").
publish: null
directories:
  output: ../../dist-electron
files:
  - ../web/dist/**/*
  - electron/**/*
  - ../web/src/assets/icons/**/*
  - package.json
win:
  target: 
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: ../web/src/assets/icons/icon.ico
mac:
  target: 
    - dmg
    - zip
  icon: ../web/src/assets/icons/icon.png
  category: public.app-category.reference
linux:
  target:
    - AppImage
    - deb
  icon: ../web/src/assets/icons
  category: Education
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
