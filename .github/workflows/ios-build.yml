name: iOS build

# Manual trigger only — macOS runners bill at 10x, and the unsigned build
# is only needed on demand. Produces sermonsmith-unsigned-ipa: an UNSIGNED
# .ipa proving the iOS build works end-to-end. App Store submission
# additionally needs Apple Developer signing (Distribution certificate +
# provisioning profile added as secrets, and a signed archive step).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: Build unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Inside Capacitor the origin is capacitor://localhost, so the API
      # base must be baked in at build time.
      - run: npm run build -w @sermonsmith/web
        env:
          VITE_API_URL: https://sermonsmith-api-production.up.railway.app
      - run: npx cap sync ios
        working-directory: apps/mobile
      - name: Archive (unsigned)
        run: |
          xcodebuild -workspace apps/mobile/ios/App/App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && zip -qry SermonSmith-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: sermonsmith-unsigned-ipa
          path: ${{ runner.temp }}/SermonSmith-unsigned.ipa
          if-no-files-found: error
