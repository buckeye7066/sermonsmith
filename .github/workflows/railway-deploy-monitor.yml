name: Railway Deploy Monitor

# Detects the exact failure mode from 2026-07-05: sermonsmith-api's Railway
# service silently lost its GitHub source connection, so merges to main
# stopped auto-deploying with no visible signal anywhere in git. This job
# fails loudly (red check on the main branch) if a push doesn't result in
# a new successful Railway deployment within a reasonable window.

on:
  push:
    branches: [main]

jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.41.2

      - name: Wait for the exact commit and verify the live release identity
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
          READY_URL: https://sermonsmith-api-production.up.railway.app/readyz
        run: node scripts/monitor-railway-deployment.mjs
