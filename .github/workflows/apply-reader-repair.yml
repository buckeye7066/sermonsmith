name: Apply isolated reader repair
on:
  push:
    branches: [fix/reader-free-text-auth-20260906]
    paths: [.github/workflows/apply-reader-repair.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'buckeye7066/sermonsmith' && github.ref == 'refs/heads/fix/reader-free-text-auth-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare exact source tree without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, subprocess
          from pathlib import Path
          raw = gzip.decompress(base64.b64decode(Path('.github/reader-repair.json.gz.b64').read_text()))
          assert hashlib.sha256(raw).hexdigest() == 'aca62ad4ce47223cdccd89938198c1acd7a54052cd376672f94d844eca716c2b', 'Payload mismatch'
          changes = json.loads(raw)
          entries = []
          for name, change in changes.items():
              path = Path(name)
              assert '..' not in path.parts and not path.is_absolute(), name
              assert name.startswith(('apps/web/', 'services/api/')) or name == '.github/workflows/export-chatgpt-audit.yml', name
              previous = path.read_text() if path.exists() else ''
              assert hashlib.sha256(previous.encode()).hexdigest() == change['sha256'], 'Source changed: ' + name
              lines = previous.splitlines(keepends=True)
              for start, end, replacement in reversed(change['edits']):
                  lines[start:end] = [replacement]
              text = ''.join(lines)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text)
              entries.append({'path': name, 'type': 'blob', 'mode': '100644', 'content': text})
              print('Prepared:', name)
          for name in ['.github/reader-repair.json.gz.b64', '.github/workflows/apply-reader-repair.yml']:
              entries.append({'path': name, 'type': 'blob', 'mode': '100644', 'sha': None})
          base = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          subprocess.run(['git', 'diff', '--check'], check=True)
          for name in ['services/api/src/middleware/auth.js', 'services/api/src/routes/auth.js', 'apps/web/e2e/readerNavigation.spec.js']:
              subprocess.run(['node', '--check', name], check=True)
          payload = json.dumps({'base_tree': base, 'tree': entries})
          result = subprocess.check_output(['gh', 'api', '--method', 'POST', 'repos/buckeye7066/sermonsmith/git/trees', '--input', '-'], input=payload, text=True)
          print('READY_TREE=' + json.loads(result)['sha'])
          print('PARENT_COMMIT=' + subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip())
          PY
