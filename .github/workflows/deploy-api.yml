name: Deploy API (Railway)

# The API service on Railway was not auto-deploying from main — it sat several
# merges behind production, so backend fixes silently never went live while the
# Vercel web app did. This workflow makes API deploys automatic and auditable.
#
# It is a no-op until a RAILWAY_TOKEN repo secret is set (Railway dashboard →
# Project → Settings → Tokens → create a token for the production environment,
# then add it under GitHub repo Settings → Secrets and variables → Actions).
# Until then the job runs green and simply skips, so it never blocks merges.

on:
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'railway.json'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-api
  cancel-in-progress: false

# Least privilege: this job uses RAILWAY_TOKEN, not the GitHub token, so it
# needs no repository write scopes.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The production deploy token must only ever ship code from main. push
    # events here are already main-only, but this also stops a manual
    # workflow_dispatch from deploying an arbitrary ref with the prod token.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Check for Railway token
        id: gate
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RAILWAY_TOKEN secret not set — skipping API deploy. Add it to enable automatic backend deploys."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # Pin the CLI to an exact, known-good version (not floating latest) so a
      # compromised future release can't run in a job that holds the production
      # deploy token.
      - name: Install Railway CLI
        if: steps.gate.outputs.enabled == 'true'
        run: npm install -g @railway/cli@4.30.5

      - name: Deploy API to Railway
        if: steps.gate.outputs.enabled == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service sermonsmith-api --ci
