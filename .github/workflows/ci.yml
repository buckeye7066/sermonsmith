name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Test-only env so loadEnv() does not throw at import time. Real
  # production secrets are NEVER set in CI.
  JWT_SECRET: ci-jwt-secret-that-is-at-least-32-chars-long
  COOKIE_SECRET: ci-cookie-secret-at-least-32-chars-long
  CORS_ORIGIN: 'http://localhost:5173'
  DATABASE_URL: 'postgresql://test:test@localhost:5432/test'
  NODE_ENV: test
  LOG_LEVEL: silent
  DISABLE_AI: '1'
  DISABLE_BILLING: '1'
  DISABLE_PASSWORD_RESET: '1'

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Verify production routing, headers, and cache policy
        run: npm run config:verify
      - run: npm run lint
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run db:generate
      - run: npm test

  integration-test:
    runs-on: ubuntu-latest
    needs: [test]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ss_test
          POSTGRES_PASSWORD: ss_test
          POSTGRES_DB: ss_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ss_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ss_test:ss_test@localhost:5432/ss_test
      RUN_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma client
        working-directory: services/api
        run: npx prisma generate
      - name: Apply migrations to test DB
        # No `|| db push` fallback — production runs `prisma migrate deploy`
        # only, so CI must fail loudly if migrations are missing or broken.
        # Otherwise CI passes and production breaks at deploy time.
        working-directory: services/api
        run: npx prisma migrate deploy
      - name: Run integration tests against real Postgres
        working-directory: services/api
        env:
          DATABASE_URL: postgresql://ss_test:ss_test@localhost:5432/ss_test
          RUN_INTEGRATION: '1'
        run: npx vitest run src/__tests__/integration.test.js --reporter=dot

  build-web:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Only build the web bundle here. `npm run build` also runs check:api
      # (api lint+typecheck+test), which is already covered by the dedicated
      # lint-and-typecheck and test jobs and needs `prisma generate` + a DB
      # that this job has not set up.
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: [build-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:web
      - name: Install Chromium and WebKit browser engines
        run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e

  desktop-build-windows-smoke:
    name: Build unsigned Windows desktop packages
    runs-on: windows-latest
    needs: [build-web]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build unsigned NSIS and portable packages on Windows
        run: npm run electron:build:win
        env:
          VITE_API_URL: https://sermonsmith-api-production.up.railway.app
      - name: Verify Windows package output
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path dist-electron -Filter *.exe -File
          if ($packages.Count -lt 2) {
            throw "Expected NSIS and portable Windows packages, found $($packages.Count)"
          }
          $packages | ForEach-Object { Write-Host "Built $($_.FullName) ($($_.Length) bytes)" }

  desktop-build-macos-smoke:
    # Build a real unpacked macOS Electron bundle at the exact PR head. This
    # deliberately disables identity discovery; signing and notarization are
    # trusted release operations, not properties of this CI artifact.
    name: Build unsigned macOS desktop application
    runs-on: macos-15
    needs: [build-web]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact requested source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build desktop web resources
        run: npm run build:web
        env:
          ELECTRON_BUILD: 'true'
          VITE_API_URL: https://sermonsmith-api-production.up.railway.app
      - name: Build unpacked macOS application
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: ../../node_modules/.bin/electron-builder --mac --dir --publish never
      - name: Verify bundle, binary identity, and absence of distribution signing
        run: |
          set -euo pipefail
          OUTPUT="$GITHUB_WORKSPACE/dist-electron"
          APP_COUNT=$(find "$OUTPUT" -type d -name 'Sermon Smith.app' | wc -l | tr -d '[:space:]')
          test "$APP_COUNT" = '1'
          APP=$(find "$OUTPUT" -type d -name 'Sermon Smith.app' -print -quit)
          PLIST="$APP/Contents/Info.plist"
          test -f "$PLIST"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")
          test "$BUNDLE_ID" = 'com.sermonsmith.app'
          test "$EXECUTABLE" = 'Sermon Smith'
          BINARY="$APP/Contents/MacOS/$EXECUTABLE"
          test -x "$BINARY"
          file "$BINARY" | tee "$RUNNER_TEMP/sermonsmith-macos-binary.txt"
          grep -q 'Mach-O' "$RUNNER_TEMP/sermonsmith-macos-binary.txt"

          SIGNING_STATUS='unsigned'
          if codesign --display --verbose=4 "$APP" 2> "$RUNNER_TEMP/sermonsmith-macos-codesign.txt"; then
            SIGNING_STATUS='ad-hoc/no-distribution-authority'
          fi
          if grep -q '^Authority=' "$RUNNER_TEMP/sermonsmith-macos-codesign.txt"; then
            echo 'CI macOS artifact unexpectedly has a distribution signing authority' >&2
            cat "$RUNNER_TEMP/sermonsmith-macos-codesign.txt" >&2
            exit 1
          fi

          ARCHIVE="$RUNNER_TEMP/SermonSmith-macos-unsigned.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ARCHIVE"
          test -s "$ARCHIVE"
          zipinfo -1 "$ARCHIVE" > "$RUNNER_TEMP/sermonsmith-macos-files.txt"
          grep -Fx 'Sermon Smith.app/Contents/Info.plist' "$RUNNER_TEMP/sermonsmith-macos-files.txt"
          grep -Fx 'Sermon Smith.app/Contents/MacOS/Sermon Smith' "$RUNNER_TEMP/sermonsmith-macos-files.txt"
          {
            echo "source_sha=$(git rev-parse HEAD)"
            echo "bundle_id=$BUNDLE_ID"
            echo "executable=$EXECUTABLE"
            echo 'package=unpacked-electron-app'
            echo "signing=$SIGNING_STATUS"
            echo 'notarization=not-performed'
            echo "archive_bytes=$(stat -f '%z' "$ARCHIVE")"
            echo "archive_sha256=$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')"
          } | tee "$RUNNER_TEMP/sermonsmith-macos-unsigned-evidence.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sermonsmith-macos-unsigned
          path: |
            ${{ runner.temp }}/SermonSmith-macos-unsigned.zip
            ${{ runner.temp }}/sermonsmith-macos-unsigned-evidence.txt
          if-no-files-found: error
          retention-days: 7

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Production dependency audit
        # Allowlist wrapper around `npm audit --omit=dev` (high/critical):
        # bare npm audit has no ignore mechanism, so one unfixable advisory
        # blocks every PR (2026-07-25: react-router RSC CSRF, fixed only in
        # 8.3.0 which peer-requires React 19). Entries live in the script with
        # reason + review-by date; expired or unlisted advisories still fail.
        run: npm run audit
