name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only env so loadEnv() does not throw at import time. Real
  # production secrets are NEVER set in CI.
  JWT_SECRET: ci-jwt-secret-that-is-at-least-32-chars-long
  COOKIE_SECRET: ci-cookie-secret-at-least-32-chars-long
  CORS_ORIGIN: 'http://localhost:5173'
  DATABASE_URL: 'postgresql://test:test@localhost:5432/test'
  NODE_ENV: test
  LOG_LEVEL: silent
  DISABLE_AI: '1'
  DISABLE_BILLING: '1'
  DISABLE_PASSWORD_RESET: '1'

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run db:generate
      - run: npm test

  integration-test:
    runs-on: ubuntu-latest
    needs: [test]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ss_test
          POSTGRES_PASSWORD: ss_test
          POSTGRES_DB: ss_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ss_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ss_test:ss_test@localhost:5432/ss_test
      RUN_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma client
        working-directory: services/api
        run: npx prisma generate
      - name: Apply migrations to test DB
        # No `|| db push` fallback — production runs `prisma migrate deploy`
        # only, so CI must fail loudly if migrations are missing or broken.
        # Otherwise CI passes and production breaks at deploy time.
        working-directory: services/api
        run: npx prisma migrate deploy
      - name: Run integration tests against real Postgres
        working-directory: services/api
        env:
          DATABASE_URL: postgresql://ss_test:ss_test@localhost:5432/ss_test
          RUN_INTEGRATION: '1'
        run: npx vitest run src/__tests__/integration.test.js --reporter=dot

  build-web:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Only build the web bundle here. `npm run build` also runs check:api
      # (api lint+typecheck+test), which is already covered by the dedicated
      # lint-and-typecheck and test jobs and needs `prisma generate` + a DB
      # that this job has not set up.
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: [build-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Production dependency audit
        # Allowlist wrapper around `npm audit --omit=dev` (high/critical):
        # bare npm audit has no ignore mechanism, so one unfixable advisory
        # blocks every PR (2026-07-25: react-router RSC CSRF, fixed only in
        # 8.3.0 which peer-requires React 19). Entries live in the script with
        # reason + review-by date; expired or unlisted advisories still fail.
        run: node scripts/security-audit.mjs
