name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only env so loadEnv() does not throw at import time. Real
  # production secrets are NEVER set in CI.
  JWT_SECRET: ci-jwt-secret-that-is-at-least-32-chars-long
  COOKIE_SECRET: ci-cookie-secret-at-least-32-chars-long
  CORS_ORIGIN: 'http://localhost:5173'
  DATABASE_URL: 'postgresql://test:test@localhost:5432/test'
  NODE_ENV: test
  LOG_LEVEL: silent
  DISABLE_AI: '1'
  DISABLE_BILLING: '1'
  DISABLE_PASSWORD_RESET: '1'

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run db:generate
      - run: npm test

  build-web:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
