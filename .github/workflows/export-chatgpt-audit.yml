# Temporary branch-only source export for the reader repair.
# Restored to workflow_dispatch-only before merging.
name: Export source for production audit

on:
  workflow_dispatch:
  push:
    branches: [fix/reader-free-text-auth-20260906]
    paths: [.github/workflows/export-chatgpt-audit.yml]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package repository source
        run: tar --exclude=.git -czf "$RUNNER_TEMP/repo-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: sermonsmith-source
          path: ${{ runner.temp }}/repo-source.tar.gz
          retention-days: 1
          if-no-files-found: error
