name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  diagnostic-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify safe failure diagnostics
        run: node --test scripts/review-failure-summary.test.mjs

  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Summarize failed review without exposing execution content
        if: ${{ failure() && steps.claude-review.outcome == 'failure' }}
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_REPO: ${{ github.repository }}
          DIAGNOSTIC_REF: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          # Fetch only the trusted default-branch helper into a fresh directory.
          # Never execute the PR's diagnostic or test code in this OIDC job.
          diagnostic_dir=$(mktemp -d "$RUNNER_TEMP/claude-review-summary.XXXXXX")
          trap 'rm -rf -- "$diagnostic_dir"' EXIT
          gh api --method GET "repos/$DIAGNOSTIC_REPO/contents/scripts/review-failure-summary.mjs" \
            -f ref="$DIAGNOSTIC_REF" --jq .content | base64 --decode > "$diagnostic_dir/summary.mjs"
          node "$diagnostic_dir/summary.mjs"

      - name: Isolate provider execution from the review plugin
        if: ${{ failure() && steps.claude-review.outcome == 'failure' }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: >-
            Reply with exactly REVIEW_PROVIDER_PROBE_OK. This is a provider
            execution diagnostic, not a code review. Do not inspect repository
            files, invoke tools, post comments, or change anything.
          claude_args: '--tools "" --max-turns 1'
